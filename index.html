<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МедПлатформа — статті спеціалістів</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<base target="_blank">
</head>
<body>

  <!-- Шапка: заголовок ліворуч, кнопка ВХІД праворуч -->
  <header class="header">
    <div class="container header__inner">
      <h1 class="logo">Мед<span>Платформа</span></h1>
      <div class="header__actions">
        <a href="editor.html" class="btn btn--small btn--outline header__btn--hidden" id="editorButton">Створити статтю</a>
        <!-- Меню користувача: нікнейм + випадний список -->
        <div class="user-menu" id="userMenu" hidden>
          <button class="btn btn--small user-menu__button" id="userMenuButton" onclick="toggleUserMenu()"></button>
          <div class="user-menu__dropdown" id="userMenuDropdown">
            <button onclick="logout()">Вийти</button>
            <button class="user-menu__danger" onclick="deleteProfile()">Видалити профіль</button>
          </div>
        </div>
        <!-- Кнопка для гостя -->
        <button class="btn btn--small" id="authButton" onclick="onAuthButton()">Вхід</button>
      </div>
    </div>
  </header>

  <!-- Статті -->
  <main class="container">
    <h2 class="section-title">Статті спеціалістів</h2>
    <div class="articles__grid" id="articlesGrid">
      <p class="articles__loading" id="articlesLoading">Завантаження статей…</p>
    </div>
  </main>

  <!-- Підвал -->
  <footer class="footer">
    <div class="container">
      <p>МедПлатформа © 2026 · Дані медичних обстежень заповнює користувач самостійно</p>
    </div>
  </footer>

  <!-- Модальне вікно: Вхід / Реєстрація -->
  <div class="modal" id="authModal">
    <div class="modal__box">
      <button class="modal__close" onclick="closeModal('authModal')">&times;</button>

      <!-- Перемикач вкладок -->
      <div class="tabs">
        <button class="tabs__btn tabs__btn--active" id="tabLogin" onclick="showTab('login')">Вхід</button>
        <button class="tabs__btn" id="tabRegister" onclick="showTab('register')">Реєстрація</button>
      </div>

      <!-- Вкладка: Вхід -->
      <form id="formLogin" onsubmit="handleLogin(event)">
        <label>Email
          <input type="email" id="loginEmail" required placeholder="you@example.com">
        </label>
        <label>Пароль
          <input type="password" id="loginPassword" required placeholder="••••••••">
        </label>
        <p class="form-error" id="loginError"></p>
        <button type="submit" class="btn btn--full">Увійти</button>
      </form>

      <!-- Вкладка: Реєстрація -->
      <form id="formRegister" class="form--hidden" onsubmit="handleRegister(event)">
        <label>Нікнейм *
          <input type="text" id="regNickname" required maxlength="30" placeholder="Як до вас звертатися">
        </label>
        <label>Стать *
          <select id="regGender" required>
            <option value="">Оберіть…</option>
            <option value="female">Жіноча</option>
            <option value="male">Чоловіча</option>
          </select>
        </label>
        <label>Рік народження *
          <input type="number" id="regBirthYear" required min="1920" max="2026" placeholder="1990">
        </label>
        <label>Роль *
          <select id="regRole" required>
            <option value="">Оберіть…</option>
            <option value="user">Користувач (пацієнт)</option>
            <option value="specialist">Спеціаліст</option>
          </select>
        </label>
        <label>Email *
          <input type="email" id="regEmail" required placeholder="you@example.com">
        </label>
        <label>Пароль * (мін. 6 символів)
          <input type="password" id="regPassword" required minlength="6" placeholder="••••••••">
        </label>
        <p class="form-error" id="regError"></p>
        <button type="submit" class="btn btn--full">Зареєструватися</button>
      </form>
    </div>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
